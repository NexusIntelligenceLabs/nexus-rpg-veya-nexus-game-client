<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus RPG Kararlı</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a2e; color: #4ecca3; overflow: hidden; font-family: sans-serif; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; }
        .stat { font-size: 16px; font-weight: bold; margin-bottom: 5px; text-shadow: 1px 1px 2px #000; }
        #debug { color: #ff4d4d; font-size: 12px; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="wallet" class="stat">Cüzdan: Aranıyor...</div>
        <div id="nxp" class="stat">NXP: 0</div>
        <div id="debug">Sistem başlatılıyor...</div>
    </div>
    <div id="game-container"></div>

    <script>
        const SUPABASE_URL = 'https://gdpiehrnpeiauhmaoumi.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkcGllaHJucGVpYXVobWFvdW1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEwMDk4MjcsImV4cCI6MjA4NjU4NTgyN30.iJHq9gnoPtBLaRuByLOV8VjesBL9qp1rQs1d4_fYJXM';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const tg = window.Telegram.WebApp;
        tg.expand();

        let wallet = tg.initDataUnsafe?.user?.id ? "TG-" + tg.initDataUnsafe.user.id : "MISAFIR-" + Math.floor(Math.random() * 1000);
        let npxScore = 0;

        document.getElementById('wallet').innerText = "Cüzdan: " + wallet;

        async function startApp() {
            try {
                let { data, error } = await supabase.from('pilots_test').select('*').eq('wallet_address', wallet).single();
                
                if (error && error.code !== 'PGRST116') throw error;

                if (!data) {
                    await supabase.from('pilots_test').insert([{ wallet_address: wallet, total_ni: 0 }]);
                    document.getElementById('debug').innerText = "Yeni hesap oluşturuldu!";
                } else {
                    npxScore = data.total_ni;
                    document.getElementById('nxp').innerText = "NXP: " + npxScore;
                    document.getElementById('debug').innerText = "Bağlantı başarılı!";
                }
            } catch (err) {
                document.getElementById('debug').innerText = "Hata: RLS veya Bağlantı sorunu.";
                console.error(err);
            }
        }

        async function updateNXP(add) {
            npxScore += add;
            document.getElementById('nxp').innerText = "NXP: " + npxScore;
            await supabase.from('pilots_test').update({ total_ni: npxScore }).eq('wallet_address', wallet);
        }

        class GameScene extends Phaser.Scene {
            constructor() { super('GameScene'); }
            create() {
                const { width, height } = this.scale;
                this.add.grid(width/2, height/2, width, height, 50, 50, 0x1a1a2e, 1, 0x4ecca3, 0.1);
                
                this.player = this.add.circle(width/2, height - 100, 30, 0x4ecca3).setStrokeStyle(4, 0xffffff);
                
                this.spawnMonster();
            }

            spawnMonster() {
                const x = Phaser.Math.Between(50, this.scale.width - 50);
                const monster = this.add.rectangle(x, 200, 60, 60, 0xff4d4d).setInteractive();
                const hpText = this.add.text(x, 130, 'BÖCEK', { fontSize: '18px', color: '#fff' }).setOrigin(0.5);
                
                monster.on('pointerdown', () => {
                    monster.destroy();
                    hpText.destroy();
                    updateNXP(10);
                    this.time.delayedCall(1000, () => this.spawnMonster());
                });
            }
        }

        new Phaser.Game({
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            scene: GameScene
        });

        startApp();
    </script>
</body>
</html>
