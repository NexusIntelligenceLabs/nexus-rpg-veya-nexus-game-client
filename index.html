<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Intelligence MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        :root { --neon-green: #0f0; --neon-blue: #00f0ff; --neon-red: #ff003c; --dark-bg: #050505; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; user-select: none; }
        
        /* HUD ve Menü (Aynı Kaldı) */
        #hud { position: fixed; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.9); padding: 12px; border-radius: 8px; border: 1px solid var(--neon-blue); min-width: 180px; }
        .bar-container { width: 100%; height: 16px; background: #222; margin-bottom: 6px; border-radius: 4px; position: relative; overflow: hidden; border: 1px solid #333; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.3s; }
        #hp-bar { background: linear-gradient(90deg, #ff003c, #80001e); } 
        #mp-bar { background: linear-gradient(90deg, #00f0ff, #005f73); }
        .bar-text { position: absolute; width: 100%; text-align: center; font-size: 10px; font-weight: bold; line-height: 16px; top: 0; text-shadow: 1px 1px #000; }
        
        #menu { position: fixed; bottom: 25px; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 500; }
        .menu-btn { background: #111; border: 1px solid var(--neon-blue); padding: 12px 18px; border-radius: 6px; color: #fff; font-size: 11px; font-weight: bold; }

        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-height: 80vh; background: rgba(10,10,10,0.98); border: 2px solid var(--neon-blue); z-index: 2000; display: none; flex-direction: column; padding: 20px; border-radius: 12px; }
        .inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; overflow-y: auto; }
        .bag-slot { height: 50px; background: #151515; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 8px; text-align: center; color: var(--neon-blue); border-radius: 4px; }
        
        /* Phaser Canvas Alanı */
        #game-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="hud">
        <div id="p-info" style="font-size:12px; font-weight:bold; color:var(--neon-blue); margin-bottom:8px;">PILOT: ...</div>
        <div class="bar-container"><div id="hp-bar" class="bar-fill"></div><div class="bar-text" id="hp-text">--- / ---</div></div>
        <div class="bar-container"><div id="mp-bar" class="bar-fill"></div><div class="bar-text" id="mp-text">--- / ---</div></div>
        <div style="font-size:11px; color:var(--neon-green); margin-top:5px;">LVL: <span id="lvl">1</span> | EXP: <span id="exp">0</span></div>
    </div>

    <!-- Phaser Buraya Çizilecek -->
    <div id="game-container"></div>

    <div id="menu">
        <div class="menu-btn" onclick="openModal('char-panel')">STATS</div>
        <div class="menu-btn" onclick="openModal('inv-panel')">INV</div>
        <div class="menu-btn" onclick="town()" id="town-btn">TOWN</div>
    </div>

    <!-- Modal Yapıları (Geliştirilmiş Mekaniklerle Aynı) -->
    <div id="char-panel" class="modal">...</div>
    <div id="inv-panel" class="modal">...</div>

    <script>
        const SUPABASE_URL = 'https://gdpiehrnpeiauhmaoumi.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkcGllaHJucGVpYXVobWFvdW1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEwMDk4MjcsImV4cCI6MjA4NjU4NTgyN30.iJHq9gnoPtBLaRuByLOV8VjesBL9qp1rQs1d4_fYJXM';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const tg = window.Telegram.WebApp;

        let p = { id: 0, username: 'Pilot', level: 1, exp: 0, nxp: 0, vit: 10, int_stat: 10, str: 10, stat_points: 0 };
        let inventory = [];

        // --- PHASER OYUN AYARLARI ---
        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            width: window.innerWidth,
            height: window.innerHeight,
            physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);
        let playerSprite;
        let mobSprite;
        let cursors;

        function preload() {
            // Şimdilik placeholder resimler kullanıyoruz
            this.load.image('player', 'https://labs.phaser.io/assets/sprites/phaser-dude.png');
            this.load.image('mob', 'https://labs.phaser.io/assets/sprites/spider.png');
        }

        function create() {
            cursors = this.input.keyboard.createCursorKeys();

            // Karakterimizi ekrana koyalım
            playerSprite = this.physics.add.sprite(config.width/2, config.height/2, 'player');
            playerSprite.setCollideWorldBounds(true);

            // Canavarımızı ekleyelim
            mobSprite = this.physics.add.sprite(200, 200, 'mob');
            
            // Çarpışma Mekaniği: Canavara değince saldırı başlasın
            this.physics.add.overlap(playerSprite, mobSprite, () => {
                // Burada senin yazdığın attackMob mekaniği tetiklenecek
            }, null, this);
        }

        function update() {
            // Basit Hareket Kontrolü (Gelecekte Joystick eklenecek)
            if (cursors.left.isDown) playerSprite.setVelocityX(-160);
            else if (cursors.right.isDown) playerSprite.setVelocityX(160);
            else playerSprite.setVelocityX(0);

            if (cursors.up.isDown) playerSprite.setVelocityY(-160);
            else if (cursors.down.isDown) playerSprite.setVelocityY(160);
            else playerSprite.setVelocityY(0);
        }

        // --- MEKANİK FONKSİYONLARI (ESKİLER BURAYA GELECEK) ---
        async function init() {
            tg.expand();
            const user = tg.initDataUnsafe?.user || { id: 12345, username: 'Test_Pilotu' };
            const { data } = await supabaseClient.from('pilots_data').select('*').eq('id', user.id).single();
            if (data) { p = data; updateUI(); }
        }

        function updateUI() {
            document.getElementById('p-info').innerText = `PILOT: ${p.username}`;
            document.getElementById('lvl').innerText = p.level;
            document.getElementById('exp').innerText = p.exp;
            
            const maxHP = 100 + (p.vit * 20);
            document.getElementById('hp-text').innerText = `${maxHP} / ${maxHP}`;
            document.getElementById('hp-bar').style.width = "100%";
        }

        init();
    </script>
</body>
</html>
