<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Intelligence - Final Engine v3.1</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
    <style>
        :root { --neon-blue: #00f0ff; --neon-red: #ff003c; --gold: #ffd700; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; touch-action: none; }
        #game-container { position: fixed; inset: 0; z-index: 1; }
        
        /* GİRİŞ EKRANLARI */
        .screen { position: fixed; inset: 0; background: #000; z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card { background: #111; border: 1px solid var(--neon-blue); padding: 15px; margin: 5px; width: 85%; border-radius: 12px; cursor: pointer; color: var(--neon-blue); font-weight: bold; text-align: center; }
        .hidden { display: none !important; }

        /* HUD & BARS */
        #hud { position: fixed; top: 10px; left: 10px; z-index: 2000; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 10px; border: 1px solid var(--neon-blue); min-width: 190px; }
        .bar-container { width: 100%; height: 20px; background: #222; margin-bottom: 8px; border-radius: 5px; position: relative; overflow: hidden; border: 1px solid #444; }
        .bar-fill { height: 100%; transition: width 0.3s; width: 100%; }
        #hp-bar { background: linear-gradient(90deg, #ff003c, #80001e); } 
        #mp-bar { background: linear-gradient(90deg, #00f0ff, #005f73); }
        .bar-text { position: absolute; width: 100%; text-align: center; font-size: 11px; font-weight: bold; line-height: 20px; color: #fff; text-shadow: 1px 1px #000; z-index: 10; top: 0; left: 0; }

        /* KASA (59 SLOT) & STATS */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; background: #0a0a0a; border: 2px solid var(--neon-blue); z-index: 5000; display: none; flex-direction: column; padding: 15px; border-radius: 12px; }
        .inv-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .inv-tabs div { flex: 1; padding: 10px; background: #222; text-align: center; font-size: 10px; cursor: pointer; border: 1px solid #444; border-radius: 5px; }
        .active-tab { background: var(--neon-blue) !important; color: #000 !important; font-weight: bold; }
        .equip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .eq-slot { height: 60px; background: #151515; border: 1px solid #333; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #555; }
        .bag-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; max-height: 200px; overflow-y: auto; display: none; }
        .bag-slot { height: 45px; background: #151515; border: 1px solid #222; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #444; }

        /* BUTONLAR */
        #menu { position: fixed; top: 10px; right: 10px; z-index: 2000; display: flex; gap: 6px; }
        .menu-btn { background: rgba(0,0,0,0.8); border: 1px solid var(--neon-blue); padding: 8px 12px; border-radius: 6px; color: #fff; font-size: 11px; font-weight: bold; }
        #joystick-zone { position: fixed; bottom: 40px; left: 30px; width: 120px; height: 120px; z-index: 1000; }
        #action-bar { position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: none; flex-direction: column; align-items: flex-end; gap: 10px; }
        .skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .skill-btn { width: 50px; height: 50px; background: rgba(17,17,17,0.9); border: 1px solid var(--neon-blue); border-radius: 8px; color: #fff; font-size: 10px; font-weight: bold; }
        .attack-btn { width: 90px; height: 90px; background: rgba(255,0,60,0.15); border: 2px solid var(--neon-red); border-radius: 50%; color: var(--neon-red); font-weight: bold; }
        .floating-text { position: absolute; font-weight: bold; pointer-events: none; animation: floatUp 0.8s forwards; z-index: 4000; }
        @keyframes floatUp { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-60px); } }
    </style>
</head>
<body>

    <div id="loading-screen" class="screen"><h2>NEXUS CORE_LOADED...</h2></div>

    <div id="race-screen" class="screen hidden">
        <h2>IRKINI SEÇ</h2>
        <div class="card" onclick="selectRace('Human')">HUMAN RESISTANCE ✊</div>
        <div class="card" onclick="selectRace('AI')">AI SENTINELS 🤖</div>
    </div>

    <div id="class-screen" class="screen hidden">
        <h2>SINIFINI SEÇ</h2>
        <div class="card" onclick="selectClass('Warrior', 0xff0000, 1.4, 4)">⚔️ WARRIOR</div>
        <div class="card" onclick="selectClass('Assassin', 0x555555, 1.1, 0)">🔪 ASSASSIN</div>
        <div class="card" onclick="selectClass('Archer', 0x00ff00, 1.1, 1)">🏹 ARCHER</div>
        <div class="card" onclick="selectClass('Mage', 0x00f0ff, 1.1, 2)">🔮 MAGE</div>
        <div class="card" onclick="selectClass('Priest', 0xffd700, 1.2, 3)">🛡️ PRIEST</div>
    </div>

    <div id="hud" style="display:none;">
        <div id="p-info" style="font-size:11px; font-weight:bold; color:var(--neon-blue); margin-bottom:8px;">---</div>
        <div class="bar-container"><div id="hp-bar" class="bar-fill"></div><div class="bar-text" id="hp-text">--- / ---</div></div>
        <div class="bar-container"><div id="mp-bar" class="bar-fill"></div><div class="bar-text" id="mp-text">--- / ---</div></div>
        <div style="font-size:10px; color:#0f0;">LVL: <span id="lvl">1</span> | STAT: <span id="stat-pts">0</span></div>
    </div>

    <div id="menu" style="display:none;">
        <button class="menu-btn" onclick="openModal('char-panel')">STATS</button>
        <button class="menu-btn" onclick="openModal('inv-panel')">KASA</button>
        <button class="menu-btn" onclick="town()">TOWN</button>
    </div>

    <div id="game-container"></div>
    <div id="joystick-zone"></div>
    
    <div id="action-bar">
        <div class="skills-grid">
            <button class="skill-btn" onclick="useSkill('Swift')">SPEED</button>
            <button class="skill-btn" onclick="useSkill('Heal')">HEAL</button>
            <button class="skill-btn" onclick="useSkill('Strike')">SKILL</button>
            <button class="skill-btn" onclick="usePot('HP')" style="color:red; border-color:red;">HP</button>
            <button class="skill-btn" onclick="usePot('MP')" style="color:cyan; border-color:cyan;">MP</button>
        </div>
        <button class="attack-btn" onclick="performAttack()">ATAK</button>
    </div>

    <div id="char-panel" class="modal">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:10px;">
            <span style="color:var(--neon-blue); font-weight:bold;">SİBER-VERİLER (STATS)</span>
            <span onclick="closeModals()" style="color:red; cursor:pointer;">[X]</span>
        </div>
        <div id="stat-list"></div>
    </div>

    <div id="inv-panel" class="modal">
        <div class="inv-tabs">
            <div id="tab-eq" class="active-tab" onclick="switchInv('eq')">EKİPMAN (9)</div>
            <div id="tab-bag" onclick="switchInv('bag')">ÇANTA (50)</div>
            <div onclick="closeModals()" style="color:red; flex:0.2; text-align:center;">X</div>
        </div>
        <div id="eq-view" class="equip-grid">
            <div class="eq-slot">KASK</div><div class="eq-slot">KOLYE</div><div class="eq-slot">SİLAH</div>
            <div class="eq-slot">ZIRH</div><div class="eq-slot">KEMER</div><div class="eq-slot">KOLLUK</div>
            <div class="eq-slot">YÜZÜK</div><div class="eq-slot">BOT</div><div class="eq-slot">YÜZÜK</div>
        </div>
        <div id="bag-view" class="bag-grid"></div>
    </div>

<script>
    let p = { 
        username: 'Pilot', race: '', class: '', color: 0xFFFFFF, scale: 1.2, frame: 4, 
        level: 1, exp: 0, str: 10, vit: 10, int: 10, dex: 10, stat_points: 5,
        currentHP: 300, currentMP: 150, isAttacking: false, moveSpeed: 210
    };
    let mobData = { hp: 500, maxHP: 500 };
    let gameScene, player, mob, phaserStarted = false, joystickData = null;

    window.onload = () => setTimeout(() => { document.getElementById('loading-screen').classList.add('hidden'); document.getElementById('race-screen').classList.remove('hidden'); }, 1000);

    window.selectRace = (r) => { p.race = r; document.getElementById('race-screen').classList.add('hidden'); document.getElementById('class-screen').classList.remove('hidden'); };
    window.selectClass = (c, col, sc, fr) => { p.class = c; p.color = col; p.scale = sc; p.frame = fr; startGame(); };

    function startGame() {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('hud').style.display = 'block';
        document.getElementById('menu').style.display = 'flex';
        document.getElementById('action-bar').style.display = 'flex';
        const bag = document.getElementById('bag-view'); bag.innerHTML = "";
        for(let i=0; i<50; i++) { let s = document.createElement('div'); s.className = 'bag-slot'; s.innerText = "--"; bag.appendChild(s); }
        updateUI(); initPhaser();
    }

    function updateUI() {
        const maxHP = 100 + (p.vit * 20); const maxMP = 50 + (p.int * 10);
        p.currentHP = Math.min(p.currentHP, maxHP); p.currentMP = Math.min(p.currentMP, maxMP);
        document.getElementById('p-info').innerText = `${p.username.toUpperCase()} [${p.race}-${p.class}]`;
        document.getElementById('hp-text').innerText = `${Math.floor(p.currentHP)} / ${maxHP}`;
        document.getElementById('mp-text').innerText = `${Math.floor(p.currentMP)} / ${maxMP}`;
        document.getElementById('hp-bar').style.width = (p.currentHP / maxHP * 100) + "%";
        document.getElementById('mp-bar').style.width = (p.currentMP / maxMP * 100) + "%";
        document.getElementById('lvl').innerText = p.level; document.getElementById('stat-pts').innerText = p.stat_points;
        const list = document.getElementById('stat-list');
        list.innerHTML = ['str','dex','int','vit'].map(s => `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${s.toUpperCase()}: <b>${p[s]}</b></span>${p.stat_points > 0 ? `<button onclick="upStat('${s}')" style="background:#0f0; border:none; padding:2px 8px;">+</button>` : ''}</div>`).join('');
    }

    window.openModal = (id) => document.getElementById(id).style.display = 'flex';
    window.closeModals = () => document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    window.switchInv = (t) => { document.getElementById('eq-view').style.display = t === 'eq' ? 'grid' : 'none'; document.getElementById('bag-view').style.display = t === 'bag' ? 'grid' : 'none'; document.getElementById('tab-eq').className = t === 'eq' ? 'active-tab' : ''; document.getElementById('tab-bag').className = t === 'bag' ? 'active-tab' : ''; };
    window.upStat = (s) => { if(p.stat_points > 0) { p[s]++; p.stat_points--; updateUI(); } };
    window.town = () => { if(player) player.setPosition(0, 0); showFT("TOWN!", "cyan", 0, 0); };

    function initPhaser() {
        if(phaserStarted) return; phaserStarted = true;
        const config = { type: Phaser.AUTO, parent: 'game-container', width: window.innerWidth, height: window.innerHeight, transparent: true, physics: { default: 'arcade' }, scene: { preload: preload, create: create, update: update } };
        new Phaser.Game(config);
    }

    function preload() {
        // Harita için indirdiğin tileset'i kullanıyoruz
        this.load.image('map_tiles', 'https://gdpiehrnpeiauhmaoumi.supabase.co/storage/v1/object/public/assets/1000024178.png');
        this.load.spritesheet('hero', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
        this.load.image('slime', 'https://labs.phaser.io/assets/sprites/slime.png');
    }

    function create() {
        gameScene = this;
        // Haritayı indirdiğin siber-karo setiyle kaplıyoruz
        this.add.tileSprite(0, 0, 10000, 10000, 'map_tiles').setOrigin(0.5);
        this.cameras.main.setZoom(0.85); // Uzaktan geniş bakış

        player = this.physics.add.sprite(0, 0, 'hero', p.frame).setScale(p.scale).setTint(p.color);
        this.cameras.main.startFollow(player);

        mob = this.physics.add.sprite(300, -200, 'slime').setScale(1.5);
        
        const manager = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: {left:'60px', bottom:'60px'}, color: '#00f0ff' });
        manager.on('move', (e, d) => { joystickData = d; });
        manager.on('end', () => { joystickData = null; if(player) player.setVelocity(0); });
    }

    function update() {
        if (!player) return;
        if (joystickData && joystickData.vector) {
            if (p.isAttacking && (p.class === 'Archer' || p.class === 'Mage')) {
                player.setVelocity(0);
            } else {
                player.setVelocity(joystickData.vector.x * p.moveSpeed, -joystickData.vector.y * p.moveSpeed);
                if (joystickData.vector.x !== 0) player.setFlipX(joystickData.vector.x < 0);
            }
        }
    }

    window.performAttack = () => {
        if (p.isAttacking) return;
        p.isAttacking = true;

        const dist = Phaser.Math.Distance.Between(player.x, player.y, mob.x, mob.y);
        let range = (p.class === 'Archer' || p.class === 'Mage') ? 350 : 160;

        if (mob.visible && dist < range) {
            let dmg = 25 + (p.str * 2);
            mobData.hp -= dmg;
            showFT(`-${Math.floor(dmg)}`, "red", mob.x, mob.y);
            gameScene.tweens.add({ targets: mob, alpha: 0.3, yoyo: true, duration: 100 });

            if (mobData.hp <= 0) {
                mob.setVisible(false);
                showFT("DEAD!", "gold", mob.x, mob.y);
                p.exp += 200; updateUI();
                // RESPAWN SİSTEMİ (Kesin Çözüm)
                setTimeout(() => { mobData.hp = 500; mob.setVisible(true); showFT("RESPAWN", "lime", mob.x, mob.y); }, 3000);
            }
        }
        setTimeout(() => { p.isAttacking = false; }, 500);
    };

    window.useSkill = (s) => {
        if(s === 'Swift') { 
            p.moveSpeed *= 1.5; player.setAlpha(0.6); 
            setTimeout(() => { p.moveSpeed /= 1.5; player.setAlpha(1); }, 10000);
        } else if(s === 'Heal') {
            p.currentHP = Math.min(100 + p.vit*20, p.currentHP + 100); updateUI();
        } else if(s === 'Strike') {
            showFT("SİBER-VURUŞ!", "orange", player.x, player.y - 60);
            performAttack(); // Skilli vuruşla tetikle
        }
    };

    window.usePot = (t) => {
        const maxHP = 100 + (p.vit * 20); const maxMP = 50 + (p.int * 10);
        if(t === 'HP') p.currentHP = Math.min(maxHP, p.currentHP + 80);
        else p.currentMP = Math.min(maxMP, p.currentMP + 50);
        updateUI();
    };

    function showFT(t, c, x, y) {
        const el = document.createElement('div'); el.className = 'floating-text'; el.innerText = t; el.style.color = c;
        const screenX = (x - gameScene.cameras.main.worldView.x) * gameScene.cameras.main.zoom;
        const screenY = (y - gameScene.cameras.main.worldView.y) * gameScene.cameras.main.zoom;
        el.style.left = screenX + 'px'; el.style.top = screenY + 'px';
        document.body.appendChild(el); setTimeout(() => el.remove(), 800);
    }
</script>
</body>
</html>
