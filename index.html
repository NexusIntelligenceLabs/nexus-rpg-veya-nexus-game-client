<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Intelligence - Pilot System</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; margin: 0; overflow: hidden; }
        #game-container { padding-top: 50px; }
        #status { font-size: 14px; margin-bottom: 20px; color: #55ff55; }
        #target { 
            width: 150px; height: 150px; background: red; margin: 20px auto; 
            border: 3px solid #fff; border-radius: 15px; cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            transition: transform 0.1s;
        }
        #target:active { transform: scale(0.9); }
        #nxp-display { font-size: 24px; font-weight: bold; margin-top: 20px; text-shadow: 0 0 10px #0f0; }
        .loading { color: orange; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="status">SİSTEM BAŞLATILIYOR...</div>
        <div id="target"></div>
        <div id="nxp-display">NXP: 0</div>
    </div>

    <script>
        // --- AYARLAR ---
        const SUPABASE_URL = 'https://gdpiehrnpeiauhmaoumi.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkcGllaHJucGVpYXVobWFvdW1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEwMDk4MjcsImV4cCI6MjA4NjU4NTgyN30.iJHq9gnoPtBLaRuByLOV8VjesBL9qp1rQs1d4_fYJXM';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const statusDiv = document.getElementById('status');
        const nxpDiv = document.getElementById('nxp-display');
        const target = document.getElementById('target');

        let score = 0;
        let isSaving = false;

        // 1. VERİLERİ YÜKLE
        async function initSystem() {
            if (!user) {
                statusDiv.innerText = "HATA: TELEGRAM BAĞLANTISI YOK";
                return;
            }

            statusDiv.innerHTML = `<span class="loading">VERİLER ÇEKİLİYOR: ${user.first_name}...</span>`;

            const { data, error } = await supabaseClient
                .from('pilots_test')
                .select('nxp')
                .eq('id', user.id)
                .single();

            if (data) {
                score = data.nxp;
                nxpDiv.innerText = "NXP: " + score;
                statusDiv.innerText = "SİSTEM AKTİF: " + user.first_name;
            } else {
                // Yeni kullanıcı kaydı
                await supabaseClient.from('pilots_test').insert({ 
                    id: user.id, 
                    username: user.username || user.first_name, 
                    nxp: 0 
                });
                statusDiv.innerText = "YENİ PİLOT KAYDI YAPILDI";
            }
        }

        // 2. PUAN KAYDET
        async function syncData() {
            if (isSaving || !user) return;
            isSaving = true;
            
            await supabaseClient.from('pilots_test').upsert({ 
                id: user.id, 
                username: user.username || user.first_name, 
                nxp: score 
            });
            
            isSaving = false;
        }

        // 3. TIKLAMA OLAYI
        target.onclick = () => {
            score += 10;
            nxpDiv.innerText = "NXP: " + score;
            
            // Görsel efekt
            target.style.background = "white";
            setTimeout(() => target.style.background = "red", 50);
            
            // Her tıklamada kaydet (veya istersen 5 tıkta bir yapabilirsin)
            syncData();
        };

        initSystem();
    </script>
</body>
</html>
