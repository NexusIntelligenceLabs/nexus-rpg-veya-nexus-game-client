<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Pilot Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; padding-top: 50px; }
        #target { width: 150px; height: 150px; background: red; margin: 20px auto; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h3>NEXUS SİSTEM TESTİ</h3>
    <div id="status">BAĞLANILIYOR...</div>
    <div id="target"></div>
    <div id="nxp">NXP: 0</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const user = tg.initDataUnsafe?.user;
        const statusDiv = document.getElementById('status');
        const nxpDiv = document.getElementById('nxp');
        const target = document.getElementById('target');
        
        let score = 0;

        if(user) {
            statusDiv.innerText = "PİLOT: " + (user.username || user.first_name);
        } else {
            statusDiv.innerText = "TARAYICI MODU (BOTTA DEĞİLSİN)";
        }

        target.onclick = () => {
            score += 10;
            nxpDiv.innerText = "NXP: " + score;
            target.style.background = "white";
            setTimeout(() => target.style.background = "red", 100);
        };
    </script>
</body>
</html>
