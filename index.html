<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Intelligence MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-green: #0f0; --neon-blue: #00f0ff; --neon-red: #ff003c; --dark-bg: #050505; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; user-select: none; }
        .screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        .card { background: #111; border: 1px solid #333; padding: 15px; margin: 10px; width: 85%; border-radius: 10px; cursor: pointer; }
        #hud, #game-world, #menu { display: none; }
        /* Diğer stiller aynı kalabilir... */
        #hud { position: fixed; top: 10px; left: 10px; z-index: 100; }
        .bar-container { width: 180px; height: 18px; background: #222; border: 1px solid #444; margin-bottom: 5px; position: relative; }
        .bar-fill { height: 100%; width: 100%; }
        #hp-bar { background: red; }
        #mp-bar { background: blue; }
        .bar-text { position: absolute; width: 100%; text-align: center; font-size: 10px; line-height: 18px; top: 0; }
        #game-world { height: 100vh; flex-direction: column; align-items: center; justify-content: center; }
        #target-mob { width: 120px; height: 120px; border: 2px solid red; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        #menu { position: fixed; bottom: 20px; width: 100%; justify-content: center; gap: 10px; }
        .menu-btn { border: 1px solid cyan; padding: 10px; }
    </style>
</head>
<body>

    <div id="race-screen" class="screen">
        <h2>TARAFINI SEÇ</h2>
        <div class="card" onclick="handleRace('Human')"><h3>HUMAN RESISTANCE</h3></div>
        <div class="card" onclick="handleRace('AI')"><h3>AI SENTINELS</h3></div>
    </div>

    <div id="class-screen" class="screen hidden">
        <h2 id="race-title">SINIF SEÇ</h2>
        <div class="card" onclick="handleFinal('Slayer')">⚔️ SLAYER</div>
        <div class="card" onclick="handleFinal('Technomancer')">🔮 TECHNOMANCER</div>
        <div class="card" onclick="handleFinal('Data-Sniper')">🏹 DATA-SNIPER</div>
        <div class="card" onclick="handleFinal('Architect')">🛡️ ARCHITECT</div>
    </div>

    <div id="hud">
        <div id="p-info">Pilot: ...</div>
        <div class="bar-container"><div id="hp-bar" class="bar-fill"></div><div class="bar-text">HP</div></div>
        <div class="bar-container"><div id="mp-bar" class="bar-fill"></div><div class="bar-text">MP</div></div>
    </div>
    <div id="game-world">
        <div id="target-mob">SENTINEL</div>
    </div>
    <div id="menu">
        <div class="menu-btn">STATLAR</div>
        <div class="menu-btn">ENVANTER</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gdpiehrnpeiauhmaoumi.supabase.co';
        const SUPABASE_KEY = 'BURAYA_TAM_ANAHTARI_YAPISTIR';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let p = null;
        let selectedRace = '';

        async function init() {
            const user = tg.initDataUnsafe?.user;
            if (!user) {
                alert("Telegram kullanıcı verisi alınamadı!");
                return;
            }

            const { data, error } = await supabaseClient.from('pilots_data').select('*').eq('id', user.id).single();
            if (data) {
                p = data;
                startGame();
            } else {
                document.getElementById('race-screen').classList.remove('hidden');
            }
        }

        window.handleRace = function(race) {
            alert(race + " seçildi, sınıf ekranına geçiliyor..."); // TEŞHİS
            selectedRace = race;
            document.getElementById('race-screen').classList.add('hidden');
            document.getElementById('class-screen').classList.remove('hidden');
            document.getElementById('race-title').innerText = race + " SINIFINI SEÇ";
        };

        window.handleFinal = async function(cls) {
            alert(cls + " seçildi, veritabanına kaydediliyor..."); // TEŞHİS
            const user = tg.initDataUnsafe.user;
            
            const { data, error } = await supabaseClient.from('pilots_data').insert({
                id: user.id,
                username: user.username || user.first_name,
                class: cls, 
                race: selectedRace,
                level: 1, exp: 0, nxp: 0, stat_points: 0,
                str: 10, dex: 10, int_stat: 10, vit: 10
            }).select().single();
            
            if (error) {
                alert("Kayıt Hatası: " + error.message); // HATA BURADAYSA SÖYLEYECEK
                console.error(error);
            } else {
                p = data;
                startGame();
            }
        };

        function startGame() {
            document.getElementById('race-screen').classList.add('hidden');
            document.getElementById('class-screen').classList.add('hidden');
            document.getElementById('hud').style.display = 'block';
            document.getElementById('game-world').style.display = 'flex';
            document.getElementById('menu').style.display = 'flex';
            document.getElementById('p-info').innerText = p.username + " [" + p.race + " " + p.class + "]";
        }

        init();
    </script>
</body>
</html>
