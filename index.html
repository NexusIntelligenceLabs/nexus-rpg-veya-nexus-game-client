<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Intelligence MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-green: #0f0; --neon-blue: #00f0ff; --neon-red: #ff003c; --dark-bg: #050505; --gold: #ffd700; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; user-select: none; }
        
        /* Ekranlar */
        .screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        h2 { color: var(--neon-blue); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; text-shadow: 0 0 10px var(--neon-blue); }
        .card { background: #111; border: 1px solid #333; padding: 15px; margin: 8px; width: 80%; border-radius: 8px; cursor: pointer; color: var(--neon-green); font-weight: bold; }
        
        /* HUD */
        #hud { position: fixed; top: 10px; left: 10px; z-index: 100; display: none; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; border: 1px solid var(--neon-blue); }
        .bar-container { width: 150px; height: 12px; background: #222; margin-bottom: 5px; border-radius: 3px; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.3s; }
        #hp-bar { background: var(--neon-red); } #mp-bar { background: var(--neon-blue); }

        /* Oyun Dünyası */
        #game-world { height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #target-mob { width: 150px; height: 150px; border: 2px solid var(--neon-red); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,0,60,0.1); }
        #loot-box { width: 100px; height: 100px; border: 2px solid var(--gold); display: none; align-items: center; justify-content: center; cursor: pointer; color: var(--gold); font-weight: bold; }
        
        /* Menü */
        #menu { position: fixed; bottom: 20px; width: 100%; display: none; justify-content: center; gap: 10px; z-index: 500; }
        .menu-btn { background: #111; border: 1px solid var(--neon-blue); padding: 10px 15px; border-radius: 5px; color: #fff; font-size: 11px; text-transform: uppercase; }

        /* Modallar */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-height: 80vh; background: #0a0a0a; border: 2px solid var(--neon-blue); z-index: 2000; display: none; flex-direction: column; padding: 15px; border-radius: 10px; }
        .inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; overflow-y: auto; }
        .bag-slot { height: 50px; background: #151515; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 8px; text-align: center; color: #aaa; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; padding: 5px; background: #111; }
        .plus-btn { background: var(--neon-green); border: none; padding: 5px 10px; border-radius: 3px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loading-screen" class="screen"><h2>NEXUS CONNECTING...</h2></div>

    <div id="race-screen" class="screen hidden">
        <h2>IRKINI SEÇ</h2>
        <div class="card" onclick="setRace('Human')">HUMAN RESISTANCE ✊</div>
        <div class="card" onclick="setRace('AI')">AI SENTINELS 🤖</div>
    </div>

    <div id="class-screen" class="screen hidden">
        <h2>SINIFINI SEÇ</h2>
        <div class="card" onclick="finalize('Slayer')">⚔️ SLAYER</div>
        <div class="card" onclick="finalize('Technomancer')">🔮 TECHNOMANCER</div>
        <div class="card" onclick="finalize('Data-Sniper')">🏹 DATA-SNIPER</div>
        <div class="card" onclick="finalize('Architect')">🛡️ ARCHITECT</div>
    </div>

    <div id="hud">
        <div id="p-info" style="font-size:10px; color:var(--neon-blue);">---</div>
        <div class="bar-container"><div id="hp-bar" class="bar-fill"></div></div>
        <div class="bar-container"><div id="mp-bar" class="bar-fill"></div></div>
        <div style="font-size:10px;">LVL: <span id="lvl">1</span> | NXP: <span id="nxp">0</span></div>
    </div>

    <div id="game-world">
        <div id="target-mob" onclick="attackMob()">
            <span style="font-size:50px;">🕷️</span>
            <span style="color:var(--neon-red); font-weight:bold;">VOID-SPIDER</span>
        </div>
        <div id="loot-box" onclick="collectLoot()">DATA-CUBE</div>
    </div>

    <div id="menu">
        <div class="menu-btn" onclick="openModal('char-panel')">STATS</div>
        <div class="menu-btn" onclick="openModal('inv-panel')">INV</div>
        <div class="menu-btn" onclick="town()" id="town-btn">TOWN</div>
    </div>

    <div id="char-panel" class="modal">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <span>STATS (PUAN: <span id="stat-pts">0</span>)</span>
            <span onclick="closeModals()" style="color:red; cursor:pointer;">[X]</span>
        </div>
        <div id="stat-content"></div>
    </div>

    <div id="inv-panel" class="modal">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <span>ENVANTER (50 Slot)</span>
            <span onclick="closeModals()" style="color:red; cursor:pointer;">[X]</span>
        </div>
        <div id="tab-bag" class="inv-grid"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gdpiehrnpeiauhmaoumi.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkcGllaHJucGVpYXVobWFvdW1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEwMDk4MjcsImV4cCI6MjA4NjU4NTgyN30.iJHq9gnoPtBLaRuByLOV8VjesBL9qp1rQs1d4_fYJXM';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const tg = window.Telegram.WebApp;

        let p = { id:123, username:'Pilot', str:10, vit:10, int_stat:10, dex:10, stat_points:0, level:1, exp:0, nxp:0, class:'Slayer', race:'Human' };
        let mobHP = 100;
        let inventory = [];

        // Çanta oluşturma
        const bagUI = document.getElementById('tab-bag');
        for(let i=0; i<50; i++) {
            let s = document.createElement('div');
            s.className = 'bag-slot'; s.id = `slot-${i}`; s.innerText = "--";
            bagUI.appendChild(s);
        }

        async function init() {
            tg.expand();
            const user = tg.initDataUnsafe?.user || { id: 12345, username: 'Test_Pilotu' };
            try {
                const { data } = await supabaseClient.from('pilots_data').select('*').eq('id', user.id).single();
                if (data) { p = data; startGame(); } 
                else { document.getElementById('loading-screen').classList.add('hidden'); document.getElementById('race-screen').classList.remove('hidden'); }
            } catch(e) { startGame(); }
        }

        window.setRace = (r) => { p.race = r; document.getElementById('race-screen').classList.add('hidden'); document.getElementById('class-screen').classList.remove('hidden'); };
        
        window.finalize = async (c) => {
            p.class = c; await supabaseClient.from('pilots_data').upsert(p); startGame();
        };

        function startGame() {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('hud').style.display = 'block';
            document.getElementById('game-world').style.display = 'flex';
            document.getElementById('menu').style.display = 'flex';
            updateUI();
        }

        function attackMob() {
            const dmg = 5 + (p.str * 1.5);
            mobHP -= dmg;
            if (mobHP <= 0) {
                document.getElementById('target-mob').style.display = 'none';
                document.getElementById('loot-box').style.display = 'flex';
            }
        }

        window.collectLoot = async () => {
            p.nxp += 60; p.exp += 40;
            if (Math.random() < 0.5) {
                let items = [{name:"Siber-Atık", stackable:true}, {name:"Veri Diski", stackable:true}, {name:"Slayer Kılıcı", stackable:false}];
                addItemToInventory(items[Math.floor(Math.random() * items.length)]);
            }
            mobHP = 100 + (p.level * 30);
            document.getElementById('target-mob').style.display = 'flex';
            document.getElementById('loot-box').style.display = 'none';
            updateUI();
            await supabaseClient.from('pilots_data').update(p).eq('id', p.id);
        };

        function addItemToInventory(item) {
            if (item.stackable) {
                let existing = inventory.find(i => i.name === item.name);
                if (existing) existing.count++; else inventory.push({ ...item, count: 1 });
            } else {
                inventory.push({ ...item, count: 1 });
            }
            updateInventoryUI();
        }

        function updateInventoryUI() {
            for(let i=0; i<50; i++) document.getElementById(`slot-${i}`).innerText = "--";
            inventory.forEach((item, idx) => {
                if(idx < 50) document.getElementById(`slot-${idx}`).innerText = item.stackable ? `${item.name} x${item.count}` : item.name;
            });
        }

        function updateUI() {
            document.getElementById('p-info').innerText = `${p.username} [${p.class}]`;
            document.getElementById('lvl').innerText = p.level;
            document.getElementById('nxp').innerText = p.nxp;
            document.getElementById('stat-pts').innerText = p.stat_points;
            renderStats();
        }

        function renderStats() {
            const cont = document.getElementById('stat-content');
            cont.innerHTML = ['str','dex','int_stat','vit'].map(s => `
                <div class="stat-row">
                    <span>${s.toUpperCase()}: ${p[s]}</span>
                    ${p.stat_points>0 ? `<button class="plus-btn" onclick="upStat('${s}')">+</button>` : ''}
                </div>`).join('');
        }

        window.upStat = async (s) => {
            p[s]++; p.stat_points--; updateUI(); await supabaseClient.from('pilots_data').update(p).eq('id', p.id);
        };

        window.openModal = (id) => { document.getElementById(id).style.display = 'flex'; };
        window.closeModals = () => { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); };
        window.town = () => alert("Nexus Core'a Işınlandın!");

        init();
    </script>
</body>
</html>
