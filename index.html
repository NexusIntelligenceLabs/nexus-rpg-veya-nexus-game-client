<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Intelligence MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-green: #0f0; --neon-blue: #00f0ff; --neon-red: #ff003c; --dark-bg: #050505; --gold: #ffd700; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; user-select: none; }
        
        .screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        
        #hud { position: fixed; top: 10px; left: 10px; z-index: 100; display: none; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 8px; border: 1px solid var(--neon-blue); }
        .bar-container { width: 160px; height: 16px; background: #222; border: 1px solid #444; margin-bottom: 5px; border-radius: 3px; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.3s; }
        #hp-bar { background: linear-gradient(90deg, #ff003c, #80001e); }
        #mp-bar { background: linear-gradient(90deg, #00f0ff, #005f73); }
        .bar-text { position: absolute; width: 100%; text-align: center; font-size: 10px; line-height: 16px; font-weight: bold; top: 0; left: 0; text-shadow: 1px 1px 0 #000; }

        #game-world { height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #target-mob { width: 150px; height: 150px; border: 3px solid var(--neon-red); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--neon-red); font-weight: bold; cursor: pointer; background: radial-gradient(circle, rgba(255,0,60,0.2) 0%, transparent 70%); box-shadow: 0 0 20px rgba(255,0,60,0.3); }
        #loot-box { width: 100px; height: 100px; border: 2px solid var(--gold); background: rgba(255, 215, 0, 0.2); display: none; align-items: center; justify-content: center; cursor: pointer; animation: pulse 1s infinite; color: var(--gold); }
        
        #menu { position: fixed; bottom: 20px; width: 100%; display: none; justify-content: center; gap: 10px; z-index: 500; }
        .menu-btn { background: #111; border: 1px solid var(--neon-blue); padding: 10px 20px; border-radius: 5px; color: #fff; font-size: 12px; font-weight: bold; }
        
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-height: 70vh; background: #0a0a0a; border: 2px solid var(--neon-blue); border-radius: 15px; z-index: 2000; display: none; flex-direction: column; padding: 20px; border-radius: 10px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .plus-btn { background: var(--neon-green); border: none; color: #000; width: 30px; height: 30px; border-radius: 5px; font-weight: bold; }

        .floating-text { position: absolute; font-weight: bold; pointer-events: none; animation: floatUp 0.8s forwards; z-index: 1000; font-size: 20px; }
        @keyframes floatUp { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-60px); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="loading-screen" class="screen">
        <h2 style="color: var(--neon-blue);">NEXUS CONNECTING...</h2>
        <p id="status-msg">Veriler senkronize ediliyor...</p>
    </div>

    <div id="race-screen" class="screen hidden">
        <h2 style="color: var(--neon-green);">IRKINI SEÇ</h2>
        <button onclick="setRace('Human')" style="padding:15px; margin:10px; width:80%;">HUMAN ✊</button>
        <button onclick="setRace('AI')" style="padding:15px; margin:10px; width:80%;">AI SENTINEL 🤖</button>
    </div>

    <div id="class-screen" class="screen hidden">
        <h2 style="color: var(--neon-blue);">SINIF SEÇ</h2>
        <button onclick="finalize('Slayer')" style="padding:10px; margin:5px; width:80%;">⚔️ SLAYER</button>
        <button onclick="finalize('Technomancer')" style="padding:10px; margin:5px; width:80%;">🔮 TECHNOMANCER</button>
    </div>

    <div id="hud">
        <div id="p-info" style="font-weight:bold; color:var(--neon-blue); margin-bottom:5px;">Pilot: ---</div>
        <div class="bar-container"><div id="hp-bar" class="bar-fill"></div><div class="bar-text">HP: <span id="hp-txt">--/--</span></div></div>
        <div class="bar-container"><div id="mp-bar" class="bar-fill"></div><div class="bar-text">MP: <span id="mp-txt">--/--</span></div></div>
        <div style="font-size:12px; color:var(--neon-green);">LVL: <span id="lvl">1</span> | NXP: <span id="nxp">0</span></div>
    </div>

    <div id="game-world">
        <div id="target-mob">SENTINEL-X</div>
        <div id="loot-box" onclick="collectLoot()">DATA-CUBE</div>
    </div>

    <div id="menu">
        <div class="menu-btn" onclick="openModal('char-panel')">👤 STATS</div>
        <div class="menu-btn" onclick="openModal('inv-panel')">🎒 INV</div>
    </div>

    <div id="char-panel" class="modal">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <span style="color:var(--neon-blue); font-weight:bold;">KARAKTER</span>
            <span onclick="closeModals()" style="color:red; cursor:pointer;">[KAPAT]</span>
        </div>
        <div id="stat-pts" style="color:var(--neon-green); margin-bottom:10px; font-weight:bold;">Puan: 0</div>
        <div id="stat-content"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gdpiehrnpeiauhmaoumi.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkcGllaHJucGVpYXVobWFvdW1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEwMDk4MjcsImV4cCI6MjA4NjU4NTgyN30.iJHq9gnoPtBLaRuByLOV8VjesBL9qp1rQs1d4_fYJXM';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const tg = window.Telegram.WebApp;

        let p = { str:10, dex:10, int_stat:10, vit:10, stat_points:0, level:1, exp:0, nxp:0 }; // Fallback data
        let mobHP = 100;

        async function init() {
            tg.expand();
            const user = tg.initDataUnsafe?.user || { id: 12345, username: 'Test_Pilotu' }; // Telegram dışı için test ID
            
            try {
                const { data, error } = await supabaseClient.from('pilots_data').select('*').eq('id', user.id).single();
                
                if (data) {
                    p = data;
                    startGame();
                } else {
                    // Kayıt yoksa seçim ekranına
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('race-screen').classList.remove('hidden');
                }
            } catch (err) {
                document.getElementById('status-msg').innerText = "Bağlantı hatası! Çevrimdışı mod başlatılıyor...";
                setTimeout(startGame, 1500);
            }
        }

        window.setRace = (r) => { p.race = r; document.getElementById('race-screen').classList.add('hidden'); document.getElementById('class-screen').classList.remove('hidden'); };
        
        window.finalize = async (c) => {
            const user = tg.initDataUnsafe?.user || { id: 12345, username: 'Test_Pilotu' };
            p.class = c; p.id = user.id; p.username = user.username || user.first_name;
            
            await supabaseClient.from('pilots_data').upsert(p);
            startGame();
        };

        function startGame() {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('hud').style.display = 'block';
            document.getElementById('game-world').style.display = 'flex';
            document.getElementById('menu').style.display = 'flex';
            updateUI();
        }

        document.getElementById('target-mob').onclick = (e) => {
            const dmg = 5 + (p.str * 1);
            mobHP -= dmg;
            spawnText(e.clientX, e.clientY, `-${dmg}`, "var(--neon-red)");
            
            if (mobHP <= 0) {
                document.getElementById('target-mob').style.display = 'none';
                document.getElementById('loot-box').style.display = 'flex';
            }
        };

        window.collectLoot = async () => {
            p.nxp += 50; p.exp += 30;
            const targetExp = 100 * Math.pow(p.level, 2);
            if (p.exp >= targetExp) { p.level++; p.stat_points += 3; alert("LEVEL UP!"); }
            
            await supabaseClient.from('pilots_data').update(p).eq('id', p.id);
            mobHP = 100 + (p.level * 20);
            document.getElementById('target-mob').style.display = 'flex';
            document.getElementById('loot-box').style.display = 'none';
            updateUI();
        };

        function updateUI() {
            document.getElementById('p-info').innerText = `${p.username || 'Pilot'} [${p.class || 'N/A'}]`;
            document.getElementById('lvl').innerText = p.level;
            document.getElementById('nxp').innerText = p.nxp;
            
            const maxH = 100 + (p.vit * 10);
            const maxM = 50 + (p.int_stat * 10);
            document.getElementById('hp-txt').innerText = `${maxH}/${maxH}`;
            document.getElementById('mp-txt').innerText = `${maxM}/${maxM}`;
            
            document.getElementById('stat-pts').innerText = `Puan: ${p.stat_points}`;
            renderStats();
        }

        function renderStats() {
            const cont = document.getElementById('stat-content');
            cont.innerHTML = `
                <div class="stat-row"><span>STR: ${p.str}</span>${p.stat_points>0?`<button class="plus-btn" onclick="upStat('str')">+</button>`:''}</div>
                <div class="stat-row"><span>DEX: ${p.dex}</span>${p.stat_points>0?`<button class="plus-btn" onclick="upStat('dex')">+</button>`:''}</div>
                <div class="stat-row"><span>INT: ${p.int_stat}</span>${p.stat_points>0?`<button class="plus-btn" onclick="upStat('int_stat')">+</button>`:''}</div>
                <div class="stat-row"><span>VIT: ${p.vit}</span>${p.stat_points>0?`<button class="plus-btn" onclick="upStat('vit')">+</button>`:''}</div>
            `;
        }

        window.upStat = async (s) => {
            if(p.stat_points > 0) {
                p[s]++; p.stat_points--;
                updateUI();
                await supabaseClient.from('pilots_data').update(p).eq('id', p.id);
            }
        };

        function spawnText(x, y, t, c) {
            const el = document.createElement('div');
            el.className = 'floating-text'; el.innerText = t; el.style.color = c;
            el.style.left = x + 'px'; el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        window.openModal = (id) => { document.getElementById(id).style.display = 'flex'; };
        window.closeModals = () => { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); };

        init();
    </script>
</body>
</html>
