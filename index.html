<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Intelligence MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-green: #0f0; --neon-blue: #00f0ff; --neon-red: #ff003c; --dark-bg: #050505; --gold: #ffd700; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; user-select: none; }
        
        /* Ekranlar */
        .screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        .card { background: #111; border: 1px solid #333; padding: 15px; margin: 10px; width: 85%; border-radius: 10px; cursor: pointer; }

        /* HUD */
        #hud { position: fixed; top: 10px; left: 10px; z-index: 100; display: none; background: rgba(0,0,0,0.8); padding: 8px; border-radius: 8px; border: 1px solid #333; }
        .bar-container { width: 160px; height: 14px; background: #222; border: 1px solid #444; margin-bottom: 5px; border-radius: 3px; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.3s; }
        #hp-bar { background: linear-gradient(90deg, #ff003c, #80001e); }
        #mp-bar { background: linear-gradient(90deg, #00f0ff, #005f73); }
        .bar-text { position: absolute; width: 100%; text-align: center; font-size: 9px; line-height: 14px; font-weight: bold; top: 0; left: 0; text-shadow: 1px 1px 0 #000; }

        /* Oyun Dünyası */
        #game-world { height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        /* Mob ve Mob Can Barı */
        #mob-container { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        #mob-hp-container { width: 120px; height: 8px; background: #333; border: 1px solid #ff003c; border-radius: 4px; overflow: hidden; }
        #mob-hp-fill { height: 100%; width: 100%; background: var(--neon-red); transition: width 0.1s; }
        #target-mob { width: 130px; height: 130px; border: 2px dashed var(--neon-red); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--neon-red); font-weight: bold; cursor: pointer; background: radial-gradient(circle, rgba(255,0,60,0.1) 0%, transparent 70%); }
        
        /* Kutu (Loot Box) */
        #loot-box { width: 80px; height: 80px; border: 2px solid var(--gold); background: rgba(255, 215, 0, 0.2); display: none; align-items: center; justify-content: center; cursor: pointer; animation: pulse 1s infinite; font-size: 10px; color: var(--gold); font-weight: bold; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Alt Menü */
        #menu { position: fixed; bottom: 20px; width: 100%; display: none; justify-content: center; gap: 10px; z-index: 500; }
        .menu-btn { background: #111; border: 1px solid var(--neon-blue); padding: 8px 15px; border-radius: 5px; font-size: 11px; cursor: pointer; color: #fff; }
        
        /* Modallar */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-height: 70vh; background: rgba(10,10,10,0.98); border: 2px solid var(--neon-blue); border-radius: 15px; z-index: 2000; display: none; flex-direction: column; padding: 15px; }
        .inv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .inv-slot { height: 60px; background: #111; border: 1px solid #444; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 9px; text-align: center; padding: 2px; }
        #tab-bag { display: none; grid-template-columns: repeat(5, 1fr); gap: 5px; overflow-y: auto; max-height: 300px; }
        .bag-slot { height: 45px; background: #111; border: 1px solid #333; border-radius: 3px; font-size: 9px; display: flex; align-items: center; justify-content: center; color: #555; overflow: hidden; }

        /* Efektler */
        .floating-text { position: absolute; font-weight: bold; pointer-events: none; animation: floatUp 0.8s forwards; z-index: 1000; }
        @keyframes floatUp { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-50px); } }
    </style>
</head>
<body>

    <div id="race-screen" class="screen">
        <h2 style="color: var(--neon-green);">IRKINI SEÇ</h2>
        <div class="card" onclick="setRace('Human')">HUMAN ✊</div>
        <div class="card" onclick="setRace('AI')">AI SENTINEL 🤖</div>
    </div>

    <div id="class-screen" class="screen hidden">
        <h2 style="color: var(--neon-blue);">SINIF SEÇ</h2>
        <div class="card" onclick="finalize('Slayer')">⚔️ SLAYER</div>
        <div class="card" onclick="finalize('Technomancer')">🔮 TECHNOMANCER</div>
    </div>

    <div id="hud">
        <div id="p-info" style="font-size: 11px; color: var(--neon-blue); margin-bottom: 5px;">Yükleniyor...</div>
        <div class="bar-container"><div id="hp-bar" class="bar-fill"></div><div class="bar-text">HP: <span id="hp-txt">100/100</span></div></div>
        <div class="bar-container"><div id="mp-bar" class="bar-fill"></div><div class="bar-text">MP: <span id="mp-txt">50/50</span></div></div>
        <div style="font-size: 10px; color: var(--neon-green);">LVL: <span id="lvl">1</span> | NXP: <span id="nxp">0</span></div>
    </div>

    <div id="game-world">
        <div id="mob-container">
            <div id="mob-hp-container"><div id="mob-hp-fill"></div></div>
            <div id="target-mob">SENTINEL-X</div>
            <div id="loot-box" onclick="collectLoot()">DATA-CUBE [AL]</div>
        </div>
        
        <div style="margin-top:20px; color:#444; font-size:10px;">Hedefe saldırarak veriyi boz!</div>
    </div>

    <div id="menu">
        <div class="menu-btn" onclick="openModal('char-panel')">👤 STATLAR</div>
        <div class="menu-btn" onclick="openModal('inv-panel')">🎒 ENVANTER</div>
        <div class="menu-btn" onclick="town()" id="town-btn">🏠 TOWN</div>
    </div>

    <div id="char-panel" class="modal">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid #333;">
            <span style="color:var(--neon-blue)">STATLAR</span><span onclick="closeModals()" style="color:red">[X]</span>
        </div>
        <div id="stat-pts" style="color:var(--neon-green); margin-bottom:10px;">Puan: 0</div>
        <div id="stat-list"></div>
    </div>

    <div id="inv-panel" class="modal">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <button id="btn-equip" onclick="switchInvTab('equip')" style="background:var(--neon-green); flex:1;">EKİPMAN</button>
            <button id="btn-bag" onclick="switchInvTab('bag')" style="background:#111; color:#fff; flex:1;">ÇANTA (50)</button>
            <span onclick="closeModals()" style="padding-left:10px; color:red">[X]</span>
        </div>
        <div id="tab-equip" class="inv-grid">
            <div class="inv-slot">KAFALIK</div><div class="inv-slot">KOLYE</div><div class="inv-slot">GÖĞÜS</div>
            <div class="inv-slot">KOLLUK</div><div class="inv-slot">KEMER</div><div class="inv-slot">DONLUK</div>
            <div class="inv-slot">YÜZÜK 1</div><div class="inv-slot">AYAKLIK</div><div class="inv-slot">YÜZÜK 2</div>
        </div>
        <div id="tab-bag"></div>
    </div>

    <script>
        // --- AYARLAR VE VERİTABANI ---
        const SUPABASE_URL = 'https://gdpiehrnpeiauhmaoumi.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkcGllaHJucGVpYXVobWFvdW1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEwMDk4MjcsImV4cCI6MjA4NjU4NTgyN30.iJHq9gnoPtBLaRuByLOV8VjesBL9qp1rQs1d4_fYJXM';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const tg = window.Telegram.WebApp;

        let p = null;
        let selectedRace = '';
        let mobHP = 100;
        let mobMaxHP = 100;
        let inventory = []; // Basit eşya listesi

        // Çantayı oluştur
        const bagUI = document.getElementById('tab-bag');
        for(let i=0; i<50; i++) {
            let s = document.createElement('div');
            s.className = 'bag-slot'; s.id = `slot-${i}`; s.innerText = "";
            bagUI.appendChild(s);
        }

        async function init() {
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            if (!user) return;
            const { data } = await supabaseClient.from('pilots_data').select('*').eq('id', user.id).single();
            if (data) { p = data; startGame(); } 
            else { document.getElementById('race-screen').classList.remove('hidden'); }
        }

        window.setRace = (r) => { selectedRace = r; document.getElementById('race-screen').classList.add('hidden'); document.getElementById('class-screen').classList.remove('hidden'); };
        
        window.finalize = async (c) => {
            const user = tg.initDataUnsafe.user;
            const { data } = await supabaseClient.from('pilots_data').upsert({
                id: user.id, username: user.username || user.first_name,
                class: c, race: selectedRace, level: 1, exp: 0, nxp: 0, stat_points: 0, str: 10, dex: 10, int_stat: 10, vit: 10
            }).select().single();
            p = data; startGame();
        };

        function startGame() {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('hud').style.display = 'block';
            document.getElementById('game-world').style.display = 'flex';
            document.getElementById('menu').style.display = 'flex';
            resetMob();
            updateUI();
        }

        // --- SAVAŞ VE LOOT SİSTEMİ ---
        function resetMob() {
            mobMaxHP = 50 + (p.level * 50);
            mobHP = mobMaxHP;
            document.getElementById('target-mob').style.display = 'flex';
            document.getElementById('mob-hp-container').style.display = 'block';
            document.getElementById('loot-box').style.display = 'none';
            updateMobUI();
        }

        document.getElementById('target-mob').onclick = (e) => {
            let dmg = 10 + (p.str / 2);
            mobHP -= dmg;
            spawnText(e.clientX, e.clientY, `-${Math.floor(dmg)}`, "var(--neon-red)");
            
            if (mobHP <= 0) {
                mobHP = 0;
                document.getElementById('target-mob').style.display = 'none';
                document.getElementById('mob-hp-container').style.display = 'none';
                document.getElementById('loot-box').style.display = 'flex';
            }
            updateMobUI();
        };

        window.collectLoot = async () => {
            // NXP ve EXP Kazanımı (Canavar seviyesine göre)
            let nGain = 50 + (p.level * 10);
            let eGain = 20 + (p.level * 5);
            p.nxp += nGain;
            p.exp += eGain;

            // İtem Düşme Şansı (%30 ihtimalle bir şey düşsün)
            let dropMsg = "";
            if (Math.random() < 0.3) {
                let items = ["Siber Hurda", "Nano Pot", "Paslı Bıçak"];
                let item = items[Math.floor(Math.random() * items.length)];
                inventory.push(item);
                dropMsg = ` | [${item}] Düştü!`;
                updateInventoryUI();
            }

            alert(`Ganimet Toplandı: +${nGain} NXP, +${eGain} EXP${dropMsg}`);
            
            // Veritabanı Güncelle
            await supabaseClient.from('pilots_data').update({ nxp: p.nxp, exp: p.exp }).eq('id', p.id);
            
            resetMob();
            updateUI();
        };

        // --- ARAYÜZ GÜNCELLEMELERİ ---
        function updateMobUI() {
            document.getElementById('mob-hp-fill').style.width = (mobHP / mobMaxHP * 100) + "%";
        }

        function updateUI() {
            if(!p) return;
            document.getElementById('p-info').innerText = `${p.username} [${p.class}]`;
            document.getElementById('lvl').innerText = p.level;
            document.getElementById('nxp').innerText = p.nxp;
            document.getElementById('hp-txt').innerText = `${100+(p.vit*10)}/${100+(p.vit*10)}`;
            document.getElementById('stat-pts').innerText = `Puan: ${p.stat_points}`;
        }

        function updateInventoryUI() {
            inventory.forEach((item, index) => {
                if(index < 50) document.getElementById(`slot-${index}`).innerText = item;
            });
        }

        window.town = () => {
            let btn = document.getElementById('town-btn');
            let count = 3;
            btn.innerText = `BEKLE (${count})`;
            let timer = setInterval(() => {
                count--;
                btn.innerText = `BEKLE (${count})`;
                if(count <= 0) {
                    clearInterval(timer);
                    btn.innerText = "🏠 TOWN";
                    alert("Şehre ışınlandın! (Şehir haritası bir sonraki fazda eklenecek)");
                }
            }, 1000);
        };

        window.switchInvTab = (t) => {
            document.getElementById('tab-equip').style.display = t === 'equip' ? 'grid' : 'none';
            document.getElementById('tab-bag').style.display = t === 'bag' ? 'grid' : 'none';
        };

        window.spawnText = (x, y, txt, color) => {
            let f = document.createElement('div');
            f.className = 'floating-text'; f.innerText = txt; f.style.color = color;
            f.style.left = x + "px"; f.style.top = y + "px";
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 800);
        };

        window.openModal = (id) => { document.getElementById(id).style.display = 'flex'; };
        window.closeModals = () => { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); };

        init();
    </script>
</body>
</html>
