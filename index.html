<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #status { position: absolute; top: 10px; left: 10px; color: #0f0; font-family: monospace; z-index: 10; }
    </style>
</head>
<body>
    <div id="status">MOTOR TESTİ: BAŞLADI...</div>
    <div id="game"></div>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game',
            backgroundColor: '#111',
            scene: {
                create: function() {
                    document.getElementById('status').innerText = "MOTOR ÇALIŞIYOR! DOKUN!";
                    
                    // Ortaya büyük bir hedef
                    let box = this.add.rectangle(window.innerWidth/2, window.innerHeight/2, 150, 150, 0x00ff00);
                    
                    // Dönme animasyonu
                    this.tweens.add({
                        targets: box,
                        angle: 360,
                        duration: 3000,
                        repeat: -1
                    });

                    // Tıklama testi
                    box.setInteractive();
                    box.on('pointerdown', () => {
                        box.setFillStyle(0xff0000);
                        document.getElementById('status').innerText = "DOKUNUŞ ALINDI!";
                        setTimeout(() => {
                            box.setFillStyle(0x00ff00);
                            document.getElementById('status').innerText = "MOTOR ÇALIŞIYOR!";
                        }, 500);
                    });
                }
            }
        };

        try {
            new Phaser.Game(config);
        } catch (e) {
            document.getElementById('status').innerText = "HATA: " + e.message;
        }
    </script>
</body>
</html>
